<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic gold gradient for outlines, flask liquid, and circuit pads -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" /> <!-- light gold -->
      <stop offset="50%" stop-color="#D97706" /> <!-- deep gold -->
      <stop offset="100%" stop-color="#92400E" /> <!-- dark bronze/gold -->
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <!-- Drop shadow filter to make elements pop -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Main Stylized 'S' shape -->
    <path d="M 380,120 
             C 320,80 180,80 160,180 
             C 150,230 180,260 220,260 
             L 320,260 
             C 380,260 410,320 380,380 
             C 340,460 180,450 140,380" 
          fill="none" 
          stroke="url(#navyGrad)" 
          stroke-width="54" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <path d="M 380,120 
             C 320,80 180,80 160,180 
             C 150,230 180,260 220,260 
             L 320,260 
             C 380,260 410,320 380,380 
             C 340,460 180,450 140,380" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="60" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          style="mix-blend-mode: overlay; opacity: 0.85;" />

    <path d="M 380,120 
             C 320,80 180,80 160,180 
             C 150,230 180,260 220,260 
             L 320,260 
             C 380,260 410,320 380,380 
             C 340,460 180,450 140,380" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Technical / Circuit Nodes (Top Right) -->
    <path d="M 240,115 L 340,115 L 380,160" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <circle cx="380" cy="160" r="14" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="380" cy="160" r="4" fill="url(#goldGrad)" />

    <path d="M 230,145 L 300,145 L 330,195" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <circle cx="330" cy="195" r="14" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="330" cy="195" r="4" fill="url(#goldGrad)" />

    <!-- Technical / Circuit Nodes (Bottom Left / Middle Left) -->
    <path d="M 200,320 L 130,320 L 110,280" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <circle cx="110" cy="280" r="14" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="110" cy="280" r="4" fill="url(#goldGrad)" />
    
    <path d="M 180,350 L 120,350 L 100,390" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <circle cx="100" cy="390" r="14" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="100" cy="390" r="4" fill="url(#goldGrad)" />

    <!-- Laboratory Flask (enclosed in bottom S loop) -->
    <g transform="translate(210, 280)">
      <!-- Liquid Inside Flask -->
      <path d="M 38,40 
               L 42,40 
               L 42,65 
               C 42,65 24,75 14,90
               C 4,105 10,128 30,132
               L 70,132
               C 90,128 96,105 86,90
               C 76,75 58,65 58,65
               L 58,40 Z" 
            fill="url(#liquidGrad)" 
            opacity="0.9" />
            
      <!-- Dynamic liquid bubbles -->
      <circle cx="35" cy="115" r="5" fill="#FFFFFF" opacity="0.5" />
      <circle cx="50" cy="105" r="7" fill="#FFFFFF" opacity="0.4" />
      <circle cx="65" cy="118" r="4" fill="#FFFFFF" opacity="0.6" />
      <circle cx="42" cy="85" r="3.5" fill="#FFFFFF" opacity="0.7" />
      <circle cx="55" cy="75" r="4.5" fill="#FFFFFF" opacity="0.6" />
      <circle cx="48" cy="55" r="3" fill="#FFFFFF" opacity="0.5" />

      <!-- Flask Glass Outline -->
      <path d="M 35,15 
               L 65,15 
               M 38,15 
               L 38,60 
               C 38,60 15,75 5,100
               C -5,125 10,140 30,140
               L 70,140
               C 90,140 105,125 95,100
               C 85,75 62,60 62,60
               L 62,15" 
            fill="none" 
            stroke="url(#goldGrad)" 
            stroke-width="10" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
            
      <!-- Flask Highlight line (gives 3D glass look) -->
      <path d="M 20,110 C 15,125 25,133 35,133" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    </g>
  </g>
</svg>
