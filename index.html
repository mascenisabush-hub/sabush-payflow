<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      // Clear Service Worker and Cache Storage instantly in dev/preview/iframe environment
      const isDevOrIframeEnv = window.location.hostname.includes('localhost') ||
                               window.location.hostname.includes('run.app') ||
                               window.location.hostname.includes('aistudio') ||
                               window.self !== window.top;
      if (isDevOrIframeEnv) {
        console.log('[PWA Inline Bypass] Development/iframe detected. Clearing caches and unregistering SW...');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister().then(function(success) {
                if (success) {
                  console.log('[PWA Inline Bypass] Unregistered Service Worker successfully.');
                  window.location.reload();
                }
              });
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) {
              caches.delete(key).then(function() {
                console.log('[PWA Inline Bypass] Deleted cache key:', key);
              });
            });
          });
        }
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Boot splash styles: fully self-contained (no external fonts/assets besides the
         app icon) so this renders instantly, before the JS bundle finishes loading.
         React's createRoot().render() replaces the entire contents of #root on mount,
         so this markup disappears automatically the moment the app boots — no manual
         removal script needed. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #050b17;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Dot-matrix "digital world map" backdrop — gold-tinted dots on the left
         half, blue-tinted on the right, meeting in the middle. */
      #boot-splash .dot-map {
        position: absolute;
        inset: -10%;
        background-image: radial-gradient(rgba(214, 155, 37, 0.5) 1px, transparent 1.4px);
        background-size: 16px 16px;
        opacity: 0.5;
        mask-image:
          radial-gradient(ellipse 60% 55% at 50% 42%, transparent 40%, black 62%),
          linear-gradient(90deg, black 50%, transparent 50%);
        -webkit-mask-image:
          radial-gradient(ellipse 60% 55% at 50% 42%, transparent 40%, black 62%),
          linear-gradient(90deg, black 50%, transparent 50%);
        mask-composite: intersect;
        -webkit-mask-composite: source-in;
      }
      #boot-splash .dot-map.dot-map-right {
        background-image: radial-gradient(rgba(56, 132, 240, 0.55) 1px, transparent 1.4px);
        mask-image:
          radial-gradient(ellipse 60% 55% at 50% 42%, transparent 40%, black 62%),
          linear-gradient(90deg, transparent 50%, black 50%);
        -webkit-mask-image:
          radial-gradient(ellipse 60% 55% at 50% 42%, transparent 40%, black 62%),
          linear-gradient(90deg, transparent 50%, black 50%);
      }

      /* Faint "flight path" great-circle arcs sweeping across each half —
         reinforces the global-network read of the reference art. */
      #boot-splash .flight-paths {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.55;
      }

      /* A soft beam of light rising from the centre mark toward the top of the
         screen, matching the vertical light column in the reference. */
      /* Beams of light converging on the centre mark from all four sides —
         gold from the left/bottom, blue from the right/top — reinforcing the
         "solar" feel from every direction, not just overhead. */
      #boot-splash .beam {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 3px;
        height: 46%;
        background: linear-gradient(to top, rgba(124, 179, 255, 0.6), rgba(124, 179, 255, 0.08) 60%, transparent);
        filter: blur(2px);
      }
      #boot-splash .beam-bottom {
        top: auto;
        bottom: 0;
        background: linear-gradient(to bottom, rgba(245, 200, 119, 0.6), rgba(245, 200, 119, 0.08) 60%, transparent);
      }
      #boot-splash .beam-left {
        top: 50%;
        left: 0;
        transform: translateY(-50%);
        width: 46%;
        height: 3px;
        background: linear-gradient(to left, rgba(245, 200, 119, 0.6), rgba(245, 200, 119, 0.08) 60%, transparent);
      }
      #boot-splash .beam-right {
        top: 50%;
        left: auto;
        right: 0;
        transform: translateY(-50%);
        width: 46%;
        height: 3px;
        background: linear-gradient(to right, rgba(124, 179, 255, 0.6), rgba(124, 179, 255, 0.08) 60%, transparent);
      }

      /* Soft sunburst flares glowing in from each corner, tinted gold on the
         left and blue on the right, like sunlight spilling in from every edge
         of the frame. */
      #boot-splash .corner-flare {
        position: absolute;
        width: 60vmax;
        height: 60vmax;
        border-radius: 50%;
        pointer-events: none;
      }
      #boot-splash .corner-tl { top: -30vmax; left: -30vmax; background: radial-gradient(circle at 100% 100%, rgba(245, 200, 119, 0.28), transparent 60%); }
      #boot-splash .corner-bl { bottom: -30vmax; left: -30vmax; background: radial-gradient(circle at 100% 0%, rgba(245, 200, 119, 0.28), transparent 60%); }
      #boot-splash .corner-tr { top: -30vmax; right: -30vmax; background: radial-gradient(circle at 0% 100%, rgba(124, 179, 255, 0.26), transparent 60%); }
      #boot-splash .corner-br { bottom: -30vmax; right: -30vmax; background: radial-gradient(circle at 0% 0%, rgba(124, 179, 255, 0.26), transparent 60%); }

      /* Extra fine sunburst spokes fanning out from the core over the rings,
         turning up the "shine" of the centre mark itself. */
      #boot-splash .rays {
        position: absolute;
        width: clamp(340px, 58vmin, 560px);
        height: clamp(340px, 58vmin, 560px);
        border-radius: 50%;
        background: repeating-conic-gradient(
          from 0deg,
          rgba(245, 200, 119, 0.14) 0deg 1.2deg,
          transparent 1.2deg 9deg
        );
        mask-image: radial-gradient(circle, transparent 32%, black 50%, transparent 72%);
        -webkit-mask-image: radial-gradient(circle, transparent 32%, black 50%, transparent 72%);
        animation: boot-lamp-spin 46s linear infinite;
        mix-blend-mode: screen;
      }
      @keyframes boot-lamp-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      #boot-splash .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 42%, transparent 0%, transparent 40%, #050b17 88%);
        pointer-events: none;
      }

      /* Soft dual-tone glow washing the lower corners, echoing the reference's
         aurora-like base without needing literal wave art. */
      #boot-splash .base-glow {
        position: absolute;
        left: -10%;
        right: -10%;
        bottom: -18%;
        height: 46%;
        background:
          radial-gradient(ellipse 46% 100% at 8% 100%, rgba(214, 155, 37, 0.24), transparent 70%),
          radial-gradient(ellipse 46% 100% at 92% 100%, rgba(56, 132, 240, 0.22), transparent 70%);
        pointer-events: none;
      }

      /* The orbit stage: rings + feature badges + the centre mark all live
         here, sized together so everything scales as one unit. */
      #boot-splash .orbit {
        position: relative;
        width: clamp(280px, 44vmin, 420px);
        height: clamp(280px, 44vmin, 420px);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #boot-splash .orbit-rings {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #boot-splash .orbit-rings.spin-cw { animation: boot-spin 30s linear infinite; }
      #boot-splash .orbit-rings.spin-ccw { animation: boot-spin-reverse 38s linear infinite; }

      /* The bright little arc on each ring is short relative to the ring's full
         circumference, so as the ring rotates it reads as a comet of light
         travelling around the circle — matching the gold glint at the top of
         the reference's ring. */
      #boot-splash .comet-gold {
        filter: drop-shadow(0 0 6px #f5c877) drop-shadow(0 0 14px rgba(184, 121, 26, 0.8));
      }
      #boot-splash .comet-blue {
        filter: drop-shadow(0 0 6px #7CA3E0) drop-shadow(0 0 14px rgba(44, 99, 184, 0.8));
      }

      #boot-splash .mark-wrap {
        position: relative;
        width: 40%;
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #boot-splash .mark-glow {
        position: absolute;
        inset: -10%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(124, 179, 255, 0.4), rgba(214, 155, 37, 0.18) 55%, transparent 72%);
        animation: boot-pulse 2.6s ease-in-out infinite;
      }

      @keyframes boot-pulse {
        0%, 100% { opacity: 0.6; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.06); }
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes boot-spin-reverse {
        to { transform: rotate(-360deg); }
      }

      /* The centre mark is already a white circular badge with the logotype
         baked in (icon-192.png) — a plain circular clip is all it needs to sit
         flush inside the rings. */
      #boot-splash .mark-icon {
        position: relative;
        width: 82%;
        aspect-ratio: 1;
        border-radius: 50%;
        z-index: 1;
        box-shadow: 0 0 0 6px rgba(5, 11, 23, 0.9), 0 12px 40px rgba(0, 0, 0, 0.5);
      }

      /* The four feature badges around the centre mark — invoicing and
         inventory on the gold (left) side, analytics and sales on the blue
         (right) side, each a rounded square rather than a hexagon. */
      #boot-splash .hex-icon {
        --hex-border: #B8791A;
        --hex-glow: rgba(184, 121, 26, 0.55);
        position: absolute;
        width: clamp(48px, 15%, 72px);
        aspect-ratio: 1;
        border-radius: 18%;
        background: linear-gradient(160deg, #0d1e3a, #071224);
        border: 1.5px solid var(--hex-border);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 16px var(--hex-glow), inset 0 0 10px rgba(255, 255, 255, 0.04);
        animation: hex-float 5s ease-in-out infinite;
      }
      #boot-splash .hex-icon svg {
        width: 44%;
        height: 44%;
        color: var(--hex-border);
        filter: drop-shadow(0 0 3px var(--hex-glow));
      }

      #boot-splash .hex-tl { top: 6%; left: 5%; --hex-border: #f5c877; --hex-glow: rgba(214, 155, 37, 0.6); animation-delay: 0s; }
      #boot-splash .hex-tr { top: 6%; right: 5%; --hex-border: #60a5fa; --hex-glow: rgba(44, 99, 184, 0.6); animation-delay: 1.2s; }
      #boot-splash .hex-bl { bottom: 6%; left: 5%; --hex-border: #D69B25; --hex-glow: rgba(214, 155, 37, 0.6); animation-delay: 2.4s; }
      #boot-splash .hex-br { bottom: 6%; right: 5%; --hex-border: #60a5fa; --hex-glow: rgba(44, 99, 184, 0.6); animation-delay: 0.6s; }

      @keyframes hex-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      #boot-splash .wordmark {
        position: relative;
        margin-top: 4px;
        text-align: center;
      }

      #boot-splash .word-main {
        font-size: clamp(28px, 6vmin, 38px);
        font-weight: 900;
        letter-spacing: 0.06em;
      }
      #boot-splash .word-sab { color: #EAF1FB; }
      #boot-splash .word-ush { color: #f0b84e; }

      #boot-splash .tagline {
        margin-top: 6px;
        font-size: 14px;
        font-weight: 400;
        color: rgba(210, 222, 240, 0.75);
        text-align: center;
      }

      #boot-splash .bar-track {
        position: relative;
        margin-top: 10px;
        width: 260px;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      #boot-splash .bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #B8791A, #f5c877);
        transition: width 0.15s linear;
      }

      #boot-splash .percent {
        margin-top: 2px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #f0b84e;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash .orbit-rings, #boot-splash .mark-glow, #boot-splash .hex-icon, #boot-splash .rays {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="dot-map"></div>
        <div class="dot-map dot-map-right"></div>
        <svg class="flight-paths" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <path d="M40,340 Q260,180 480,300 T900,260" fill="none" stroke="#D69B25" stroke-width="1" stroke-dasharray="1 7" opacity="0.55" />
          <path d="M20,520 Q220,440 420,500 T760,430" fill="none" stroke="#D69B25" stroke-width="1" stroke-dasharray="1 7" opacity="0.4" />
          <path d="M560,300 Q740,200 960,320 T1180,260" fill="none" stroke="#5B9CF0" stroke-width="1" stroke-dasharray="1 7" opacity="0.55" />
          <path d="M580,480 Q780,420 980,470 T1200,410" fill="none" stroke="#5B9CF0" stroke-width="1" stroke-dasharray="1 7" opacity="0.4" />
        </svg>
        <div class="corner-flare corner-tl"></div>
        <div class="corner-flare corner-tr"></div>
        <div class="corner-flare corner-bl"></div>
        <div class="corner-flare corner-br"></div>
        <div class="rays"></div>
        <div class="beam"></div>
        <div class="beam beam-bottom"></div>
        <div class="beam beam-left"></div>
        <div class="beam beam-right"></div>
        <div class="base-glow"></div>
        <div class="vignette"></div>

        <div class="orbit">
          <svg class="orbit-rings spin-cw" viewBox="0 0 460 460" aria-hidden="true">
            <circle cx="230" cy="230" r="212" fill="none" stroke="rgba(184,121,26,0.28)" stroke-width="1.4" stroke-dasharray="2 10" />
            <circle cx="230" cy="230" r="212" class="comet-gold" fill="none" stroke="#f5c877" stroke-width="3" stroke-linecap="round" stroke-dasharray="26 1306" />
          </svg>
          <svg class="orbit-rings spin-ccw" viewBox="0 0 460 460" aria-hidden="true">
            <circle cx="230" cy="230" r="184" fill="none" stroke="rgba(44,99,184,0.22)" stroke-width="1" stroke-dasharray="1 12" />
            <circle cx="230" cy="230" r="184" class="comet-blue" fill="none" stroke="#7CA3E0" stroke-width="2" stroke-linecap="round" stroke-dasharray="16 1140" />
          </svg>

          <div class="hex-icon hex-tl" title="Faturação">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5"/><path d="M9 13h7M9 17h5"/></svg>
          </div>
          <div class="hex-icon hex-tr" title="Relatórios">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11"/><path d="M11 20V6"/><path d="M17 20v-9"/><path d="M3 20h18"/></svg>
          </div>
          <div class="hex-icon hex-bl" title="Inventário">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 7.5 12 12l9-4.5L12 3z"/><path d="M3 7.5V16.5L12 21l9-4.5V7.5"/><path d="M12 12v9"/></svg>
          </div>
          <div class="hex-icon hex-br" title="Vendas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L20 8H6"/><circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none"/></svg>
          </div>

          <div class="mark-wrap">
            <div class="mark-glow"></div>
            <img class="mark-icon" src="/icon-192.png" alt="Sabush" />
          </div>
        </div>

        <div class="wordmark">
          <div class="word-main"><span class="word-sab">SAB</span><span class="word-ush">USH</span></div>
        </div>
        <div class="tagline">A carregar Sabush System ERP...</div>
        <div class="bar-track"><div class="bar-fill" id="boot-bar-fill"></div></div>
        <div class="percent"><span id="boot-percent">0%</span></div>
      </div>
    </div>
    <script>
      // Purely cosmetic progress readout for the boot splash — eases toward (but
      // never claims) 100%, since the splash is actually removed the instant
      // React mounts and replaces #root.
      (function () {
        var el = document.getElementById('boot-percent');
        var bar = document.getElementById('boot-bar-fill');
        if (!el) return;
        var pct = 0;
        var timer = setInterval(function () {
          pct += (100 - pct) * 0.1 + 0.6;
          if (pct >= 97) { pct = 97; clearInterval(timer); }
          el.textContent = Math.round(pct) + '%';
          if (bar) bar.style.width = pct + '%';
        }, 160);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
